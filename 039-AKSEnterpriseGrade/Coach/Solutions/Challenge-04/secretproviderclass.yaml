# Workload Identity is the preferred, most secure authentication approach for
# this scenario: federate a dedicated identity to the consuming service account.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: __akv_name__
spec:
  provider: azure
  parameters:
    clientID: "__identity_client_id__" # Client ID of the federated managed identity
    keyvaultName: "__akv_name__"
    objects: |
      array:
        - |
          objectName: sqlpassword
          objectAlias: SQL_SERVER_PASSWORD # Filename expected by the API
          objectType: secret
          objectVersion: "" # Latest version
    tenantId: "__tenant_id__"
  # Mount directly; do not sync the database password to a Kubernetes Secret.